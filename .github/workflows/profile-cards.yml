name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render_cards.py, fonts/**, assets/**, .github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ github.repository_owner }}
      # The default token only sees public contributions. To count private ones,
      # add a classic PAT with the read:user scope as the PROFILE_TOKEN secret.
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: pip install "fonttools==4.65.0"

      - name: Refresh contribution data
        run: |
          mkdir -p data
          gh api graphql -F login="$USERNAME" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' --jq '.data.user.contributionsCollection.contributionCalendar
                     | {total: .totalContributions,
                        days: [.weeks[].contributionDays[] | {date, count: .contributionCount}]}' \
            > data/contributions.json.tmp
          mv data/contributions.json.tmp data/contributions.json
          gh repo list "$USERNAME" --limit 100 --no-archived --visibility public \
            --json name,description,primaryLanguage,stargazerCount,pushedAt > data/repos.json

      - name: Render cards
        run: python render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "Refresh profile cards"
            git push
          fi
